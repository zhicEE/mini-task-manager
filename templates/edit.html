{% extends "base.html" %}

{% block title %}Edit Task · Task Manager{% endblock %}

{% block content %}
<section class="edit-shell">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Update details</p>
            <h1>Edit task</h1>
        </div>
    </div>

    <form class="panel edit-form" action="{{ url_for('edit', task_id=task.id) }}" method="post">
        <div class="field">
            <label for="title">Task title</label>
            <input id="title" name="title" value="{{ task.title }}" required autofocus>
        </div>

        <div class="field">
            <label for="deadline">Deadline <span>(optional)</span></label>
            <input
                id="deadline"
                name="deadline"
                type="date"
                min="{{ today }}"
                value="{{ task.deadline }}"
            >
        </div>

        <div class="form-actions">
            <button class="button button-primary" type="submit">Save changes</button>
            <a class="button button-secondary" href="{{ url_for('home') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
